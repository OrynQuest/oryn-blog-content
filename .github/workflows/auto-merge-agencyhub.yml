name: Auto-merge Agency Hub posts

# Agency Hub publishes a post as a pull request from the AceWattGit machine
# account on a branch named agencyhub/<slug>. This workflow checks it against
# the contract AND the founders' copy rules (.github/scripts/check-post.sh:
# banned wording, search-result limits, hero alt text, no people in website
# pictures) and comments every problem on the pull request, so the Hub can fix
# its own draft. It merges only a clean post, and while HOLD_NEW_POSTS is
# "true" a person still checks the facts first. The site's own loader remains
# the safety net: a post that breaks an editorial hard rule is hidden until
# fixed, never a broken site.
#
# Shadow mode (2 Oct 2026, the Agency Hub automation plan): every check leaves
# a hidden verdict in its pull-request comment, `<!-- gate-verdict: pass|fail -->`
# plus the commit it judged, `<!-- gate-head: <sha> -->`. The verdict is the
# gates' own judgement of the post (contract + copy rules) — the hold for a
# person (HOLD_NEW_POSTS, edits to live posts) is a policy, not a verdict, so
# it does not change it. gate-ledger.yml compares it with what a person then
# did. A post this workflow merges itself is handed to live-check.yml and
# gate-ledger.yml (a merge made with the workflow token starts no workflow).
#
# Contract: README.md in this repository.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write # start live-check.yml and gate-ledger.yml after a merge

jobs:
  check-and-merge:
    if: github.event.pull_request.user.login == 'AceWattGit' && startsWith(github.event.pull_request.head.ref, 'agencyhub/')
    runs-on: ubuntu-latest
    steps:
      # The BASE branch (pull_request_target's default checkout), never the
      # pull request's code: the rules script that runs is the one on main.
      - name: Check out the rules (main)
        uses: actions/checkout@v4
      - name: Check the changed files against the contract
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # "true" = NEW posts wait for a person too. Set 23 Sep 2026: the Hub
          # now approves pieces with no human in the loop, and its approved
          # queue repeated product-fact errors John had just removed from
          # PR #8. Set back to "false" once the Hub has a human approval step
          # (or its fact gate is verified) — then new posts merge on their own.
          HOLD_NEW_POSTS: "true"
        run: |
          set -euo pipefail
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[] | "\(.status) \(.filename)"')
          echo "$files"
          fail=""
          # problems = the gates' verdict (shadow mode); the hold lines below are
          # policy, kept out of it.
          problems=0
          problem() { fail="$fail\n$1"; problems=$((problems+1)); }
          while read -r status file; do
            [ -z "$file" ] && continue
            case "$file" in
              parents/*.md|vendors/*.md) ;;
              public/blog/*.png|public/blog/*.jpg|public/blog/*.jpeg|public/blog/*.webp) ;;
              *) problem "- $file is outside parents/, vendors/ or public/blog/";;
            esac
            case "$status" in
              added)
                if [[ "$file" == *.md && "$HOLD_NEW_POSTS" == "true" ]]; then fail="$fail\n- $file: new post — held for a person to check the facts before it goes live (HOLD_NEW_POSTS)"; fi;;
              modified)
                # A change to an EXISTING post is not merged on its own: the
                # Hub's image judge accepted an off-topic hero on 21 Sep 2026
                # and re-published over a hand fix within the hour. New posts
                # still merge automatically; edits wait for a human. Images
                # too: a replaced hero or section image changes a live post
                # just as much as its text (PR #9, 23 Sep 2026, went live with
                # nobody looking).
                if [[ "$file" == *.md ]]; then fail="$fail\n- $file: changes an existing post — needs a human look before it goes live";
                else fail="$fail\n- $file: replaces an image on an existing post — needs a human look before it goes live"; fi;;
              *) problem "- $file: $status is not allowed (only add or modify)";;
            esac
            if [[ "$file" == *.md ]]; then
              fm=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${HEAD_SHA}" --jq '.content' | base64 -d | awk 'NR==1 && $0!="---" {bad=1} NR>1 && /^---$/ {done=1} NR>1 && !done && !bad {print} END {exit bad}')
              for key in title description date; do
                echo "$fm" | grep -Eq "^${key}:[[:space:]]*[^[:space:]]" || problem "- $file: front-matter is missing ${key}"
              done
              gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${HEAD_SHA}" --jq '.content' | base64 -d > /tmp/post.md
              rules=$(bash .github/scripts/check-post.sh /tmp/post.md "$file")
              [ -n "$rules" ] && problem "$rules"
              base=$(basename "$file" .md)
              echo "$base" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$' || problem "- $file: slug must be lowercase words joined by hyphens"
            fi
          done <<< "$files"
          if [ "$problems" -gt 0 ]; then verdict=fail; else verdict=pass; fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          printf '\n<!-- gate-verdict: %s -->\n<!-- gate-head: %s -->\n' "$verdict" "$HEAD_SHA" > /tmp/verdict.txt
          if [ -n "$fail" ]; then
            printf 'Not merged automatically:%b\n' "$fail" | tee /tmp/reason.txt
            cat /tmp/verdict.txt >> /tmp/reason.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain why it stayed open
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/reason.txt
      - name: Record the verdict (no problems found)
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "Checked: no problems found — merging."; cat /tmp/verdict.txt; } > /tmp/pass.txt
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pass.txt
      - name: Merge
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
      # A merge made with the workflow token starts no other workflow, so start
      # the live check (gate 5) and the shadow-mode ledger by hand.
      - name: Start the live check and the ledger
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')
          gh workflow run live-check.yml --repo "$GITHUB_REPOSITORY" --ref main -f sha="$sha"
          gh workflow run gate-ledger.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr="$PR"
